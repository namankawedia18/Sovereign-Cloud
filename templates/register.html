{% extends "base.html" %}

{% block title %}Register | Sovereign Cloud{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="form-card">
        <h1>Create account</h1>
        <p>Set up your secure storage account to get started.</p>

        <form method="POST">
            <div class="form-group">
                <label class="label" for="username">Username</label>
                <input class="input" type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem;">
                Register
            </button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
</div>
{% endblock %}
