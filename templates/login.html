{% extends "base.html" %}

{% block title %}Login | Sovereign Cloud{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="form-card">
        <h1>Welcome back</h1>
        <p>Sign in to access your secure cloud workspace.</p>

        <form method="POST">
            <div class="form-group">
                <label class="label" for="email">Email</label>
                <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem;">
                Login
            </button>
        </form>

        <div class="form-footer">
            Need an account? <a href="/register">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
