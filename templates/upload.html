{% extends "base.html" %}

{% block title %}Upload File | Sovereign Cloud{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 620px; margin: 0 auto; width: 100%;">
    <h1>Upload a file</h1>
    <p>Select a file and assign a classification to enforce the storage policy.</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label class="label" for="file">Select file</label>
            <input class="file-input" type="file" id="file" name="file" required>
        </div>

        <div class="form-group">
            <label class="label" for="classification">Classification</label>
            <select class="select" id="classification" name="classification" required>
                <option value="">Select Classification</option>
                <option value="Government">Government</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Public">Public</option>
            </select>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" type="submit">Upload</button>
            <a class="btn btn-secondary" href="/dashboard">Back to Dashboard</a>
        </div>
    </form>
</div>
{% endblock %}
